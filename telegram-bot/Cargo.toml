[package]
name = "telegram-chatbot"
version = "0.8.0"
authors = ["Bryant Deters <bryantdeters@gmail.com>"]
edition = "2021"

[dependencies]
chrono = "0.4.39"
teloxide = { version = "0.15", features = ["macros"] }
serde = "1"
serde_derive = "1"
simple_moving_average = "1.0.2"
reqwest = {version ="0.12.19", features = ["json", "rustls-tls"]}
#prometheus = "0.13"
tokio = { version =  "1", features = ["rt-multi-thread", "macros"] }
#sysinfo = "0.27.0"
spending-tracker = { path = "../spending-tracker" }
metro-schedule = { path = "../metro-schedule" }
notification-service = { path = "../notification-service" }
winnow = "0.7"

[dev-dependencies]
criterion = "0.6.0"

[[bench]]
name = "parser_benchmark"
harness = false
